
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Smart Score - iPad</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #eef4ff;
      padding: 20px;
      text-align: center;
    }
    main {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 18px;
    }
    button {
      padding: 14px;
      width: 100%;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 10px;
      font-size: 18px;
    }
    #reader { margin-top: 15px; }
    #result { font-size: 20px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main>
    <h2>QR Smart Score</h2>
    <p>ทดสอบกล้องสแกน QR Code บน iPad</p>
    <button id="startBtn" onclick="startScan()">เปิดกล้องสแกน QR</button>
    <div id="reader"></div>
    <p id="result">ยังไม่ได้สแกน</p>
  </main>
  <script>
    let scanner;

    async function startScan() {
      document.getElementById("result").textContent =
        "กำลังเปิดกล้อง...";

      try {
        scanner = new Html5Qrcode("reader");

        await scanner.start(
          { facingMode: "environment" },
          { fps: 10, qrbox: 220 },
          function(decodedText) {
            document.getElementById("result").textContent =
              "อ่าน QR ได้: " + decodedText;
          }
        );
      } catch (error) {
        document.getElementById("result").textContent =
          "เปิดกล้องไม่ได้: " + String(error);
      }
    }
  </script>
</body>
</html>
